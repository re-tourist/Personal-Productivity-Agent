name: PPA M7 Verification
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PPA_ENABLE_LIVE_QWEN: '0'
      PPA_AUTH_CONFIG: ''
      PPA_TASK_SERVICE_URL: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # B0 fixtures must come from the immutable historical source.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and test dependencies
        run: python -m pip install -c tests/fixtures/r2_b0/constraints.txt -e '.[dev]'
      - name: Bytecode compilation
        run: python -m compileall -q src tests
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run full pytest suite (fake models, no paid API)
        run: python -m pytest -q
      - name: Run deterministic M7 evaluation
        run: python -m productivity_agent.evaluation --out reports/m7-offline-evaluation.json
      - name: Verify authenticated local startup and persistent restart
        run: python -m scripts.verify_final_delivery --out reports/task08/local-delivery.json
      - name: Upload M7 report
        uses: actions/upload-artifact@v4
        with:
          name: m7-offline-evaluation
          path: reports/m7-offline-evaluation.json
      - name: Upload local delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppa-final-delivery
          path: reports/task08/local-delivery.json
      - name: Upload R2 immutable compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-b0-compatibility
          path: reports/r2-b0/pytest-compatibility.json
      - name: Upload R2-B1 nested read recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-b1-read-recovery
          path: reports/r2-b1/nested-read-compatibility.json
      - name: Upload R2-B2 intermediate creation recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-b2-creation-recovery
          path: reports/r2-b2/intermediate-creation.json
